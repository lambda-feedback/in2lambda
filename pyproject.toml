[tool.poetry]
name = "in2lambda"
version = "2.0.0"
description = "Converts content ready for import into Lambda Feedback"
authors = []
license = "MIT"
readme = "README.md"
include = ["in2lambda/py.typed"]
classifiers = [
  "Natural Language :: English",
  "Operating System :: OS Independent",
  'Typing :: Typed',
  'Development Status :: 3 - Alpha',
  'Programming Language :: Python :: 3 :: Only',
]

homepage = "https://lambda-feedback.github.io/in2lambda"
repository = "https://github.com/lambda-feedback/in2lambda"
documentation = "https://lambda-feedback.github.io/in2lambda"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/lambda-feedback/in2lambda/issues"

[tool.poetry.dependencies]
python = "^3.10"
panflute = { version = "^2.3.1", optional = true }
# Only for reading a spec, which is only ever run against a converted document.
pyyaml = { version = "^6.0", optional = true }
rich-click = "^1.7.4"
# At 0.20.0 and below, the import hook in in2lambda/__init__.py leaves `cli` a plain
# function: `@cli.command()` then raises AttributeError at import (0.19.0, 0.20.0), or
# `in2lambda ...` runs convert's body whatever the arguments (0.18.5). 0.20.1 is the
# first version that works; 0.22 is the series this is locked to and tested against.
beartype = "^0.22"

[tool.poetry.extras]
# Only needed to convert documents; the Python API works without it.
convert = ["panflute", "pyyaml"]

[tool.poetry.scripts]
in2lambda = "in2lambda.main:cli"

[tool.poetry.group.dev.dependencies]
black = ">=24.3,<27.0"
isort = "^5.13.2"
pydocstyle = "^6.3.0"
mypy = "^1.9.0"
pytest = ">=8.1.1,<10.0.0"
pytest-cov = "^4.1.0"
pytest-sugar = "^1.0.0"
pre-commit = "^3.6.2"

[tool.poetry.group.docs.dependencies]
furo = "^2024.1.29"
myst-parser = "^2.0.0"
sphinx = "^7.2.6"
sphinx-copybutton = "^0.5.2"
sphinx-design = "^0.5.0"
sphinx-click = "^5.1.0"
sphinxext-opengraph = "^0.9.1"
sphinxcontrib-pdfembed = { git = "https://github.com/SuperKogito/sphinxcontrib-pdfembed.git" }
sphinxcontrib-programoutput = "^0.17"
sphinx-togglebutton = "^0.3.2"

[tool.mypy]
# panflute is missing type hints
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
# Collect the unit tests in tests/, the doctests embedded in the package, and the
# worked example on the question format page. That page is named rather than
# docs/source, because --doctest-modules would otherwise import conf.py.
testpaths = ["tests", "in2lambda", "docs/source/question-format.md"]
addopts = "--doctest-modules --doctest-glob=*.md"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
